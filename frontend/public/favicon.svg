<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1730"/>
      <stop offset="100%" stop-color="#0b0b10"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7ae0"/>
      <stop offset="100%" stop-color="#453a7a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3defe"/>
      <stop offset="100%" stop-color="#f0a8dd"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- book -->
  <rect x="132" y="128" width="248" height="280" rx="16" fill="#000000" opacity="0.28"/>
  <rect x="124" y="120" width="248" height="280" rx="16" fill="url(#cover)"/>
  <rect x="124" y="120" width="24" height="280" rx="12" fill="#ffffff" opacity="0.14"/>
  <rect x="360" y="136" width="12" height="248" rx="6" fill="#f4f1ff" opacity="0.5"/>

  <!-- glow behind sparkle -->
  <circle cx="246" cy="256" r="72" fill="url(#glow)" opacity="0.5" filter="url(#blur)"/>

  <!-- sparkle sigil -->
  <path
    d="M246 168
       C 251 212, 290 251, 334 256
       C 290 261, 251 300, 246 344
       C 241 300, 202 261, 158 256
       C 202 251, 241 212, 246 168
       Z"
    fill="url(#glow)"
  />
</svg>
